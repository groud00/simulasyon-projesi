<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title data-i18n="bio_page_title">Ultimate Biyoloji Simülasyonu - V2.8</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020205;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }

        canvas {
            display: block;
            position: fixed !important;
            top: 0;
            left: 0;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 0;
        }

        /* Geri Dönüş Butonu (Sol Üst) */
        #back-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 100;
            color: #fff;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
        }

            #back-btn:active {
                transform: scale(0.92);
                background: rgba(0, 250, 255, 0.2);
            }

        /* Ana Ekran Onay Modalı */
        .modal-backdrop {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-card {
            background: #121826;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            width: 88%;
            max-width: 320px;
            padding: 24px 20px 20px 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.2);
        }

        @keyframes modalPop {
            from {
                transform: scale(0.85);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-card h3 {
            margin: 0 0 10px 0;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            border-bottom: none;
            padding-bottom: 0;
            text-shadow: none;
            text-transform: none;
        }

        .modal-card p {
            margin: 0 0 22px 0;
            color: #94a3b8;
            font-size: 13.5px;
            line-height: 1.4;
        }

        .modal-buttons {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-cancel {
            background: #222a38;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
        }

        .btn-confirm {
            background: #38bdf8;
            color: #0b1329;
            font-weight: 700;
        }

        .modal-btn:active {
            transform: scale(0.95);
            opacity: 0.9;
        }

        /* Ortak Cam Paneli Tasarımı */
        .glass-panel {
            background: rgba(5, 10, 20, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 250, 255, 0.2);
            border-radius: 12px;
            padding: 15px;
            position: absolute;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }

        #menu-panel {
            top: 18px;
            left: 72px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 220px;
            z-index: 50;
        }

        #science-panel {
            top: 20px;
            right: 20px;
            width: 280px;
            z-index: 50;
            padding: 0;
        }

        #action-panel {
            bottom: 65px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 700px;
            z-index: 45;
        }

        h3 {
            margin: 0 0 15px 0;
            color: #00faff;
            font-size: 16px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 250, 255, 0.5);
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
            border-bottom: 1px dashed rgba(255,255,255,0.1);
            padding-bottom: 4px;
        }

        .data-label {
            color: #aaa;
        }

        .data-value {
            font-weight: bold;
            color: #fff;
            text-align: right;
        }

        .highlight {
            color: #ff0055;
            text-shadow: 0 0 8px rgba(255,0,85,0.6);
        }

        #info-card {
            display: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 300px;
            text-align: center;
            border-top: 4px solid #00faff;
            z-index: 60;
        }

        .btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            text-align: center;
            transition: all 0.3s;
        }

            .btn.active {
                background: rgba(0, 250, 255, 0.2);
                border-color: #00faff;
                box-shadow: 0 0 15px rgba(0, 250, 255, 0.3);
            }

            .btn:hover {
                background: rgba(255, 255, 255, 0.15);
            }

            .btn:active {
                transform: scale(0.95);
            }

        #toast {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 0, 85, 0.9);
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 15px;
            display: none;
            z-index: 100;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(255,0,85,0.6);
        }

        #science-content-wrapper {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

            #science-content-wrapper.closed {
                grid-template-rows: 0fr;
            }

        .science-inner {
            overflow: hidden;
            padding: 15px 15px 5px 15px;
        }

        .science-handle-zone {
            width: 100%;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.2);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            transition: background 0.3s;
        }

            .science-handle-zone:hover {
                background: rgba(0, 250, 255, 0.1);
            }

        .science-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 4px;
        }

        .science-toggle-text {
            font-size: 11px;
            color: #00faff;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        #edu-panel {
            position: fixed;
            bottom: 0;
            left: 50%;
            width: 90%;
            max-width: 800px;
            height: 50vh;
            min-height: 380px;
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            border-bottom: none;
            transform: translateX(-50%) translateY(calc(100% - 40px));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
            z-index: 90;
            display: flex;
            flex-direction: column;
            padding: 0 20px 20px 20px;
        }

            #edu-panel.open {
                transform: translateX(-50%) translateY(0);
                box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            }

        .edu-handle-zone {
            width: 100%;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            gap: 10px;
        }

        .edu-handle {
            width: 50px;
            height: 5px;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 5px;
        }

        .edu-toggle-text {
            font-size: 12px;
            color: #00faff;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .edu-content-area {
            flex: 1;
            overflow-y: auto;
            margin-top: 10px;
            padding-right: 10px;
            font-size: 14.5px;
            line-height: 1.6;
            color: #d1d5db;
        }

            .edu-content-area::-webkit-scrollbar {
                width: 6px;
            }

            .edu-content-area::-webkit-scrollbar-thumb {
                background: rgba(0, 250, 255, 0.4);
                border-radius: 4px;
            }

            .edu-content-area h4 {
                color: #fff;
                margin-bottom: 5px;
                margin-top: 15px;
                font-size: 15px;
                border-left: 3px solid #00faff;
                padding-left: 8px;
            }

        .edu-term {
            color: #00faff;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            #back-btn {
                top: 15px;
                left: 15px;
            }

            #menu-panel {
                top: 15px;
                left: 68px;
                right: 15px;
                width: auto;
                flex-direction: row;
                overflow-x: auto;
                padding: 8px;
                z-index: 60;
            }

                #menu-panel .btn {
                    white-space: nowrap;
                    flex-shrink: 0;
                }

            #science-panel {
                top: 75px;
                left: 15px;
                right: 15px;
                width: auto;
            }

            #action-panel {
                bottom: 60px;
                left: 10px;
                right: 10px;
                width: auto;
                transform: none;
                z-index: 50;
            }

            #edu-panel {
                width: 100%;
                height: 60vh;
                border-radius: 20px 20px 0 0;
            }
        }
    </style>
</head>
<body>

    <!-- Sol Üst Geri Butonu -->
    <div id="back-btn" onclick="openNavModal()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
    </div>

    <!-- Onay Modalı -->
    <div id="nav-modal" class="modal-backdrop">
        <div class="modal-card">
            <h3 id="modal-title">Ana Ekrana Dön</h3>
            <p id="modal-desc">Ana ekrana dönmek istediğinize emin misiniz?</p>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeNavModal()" id="modal-cancel">İptal</button>
                <button class="modal-btn btn-confirm" onclick="confirmGoHome()" id="modal-confirm">Evet</button>
            </div>
        </div>
    </div>

    <div id="toast">Bildirim</div>

       <div id="menu-panel" class="glass-panel">
        <button class="btn active" onclick="setMode('DNA')" id="btn-DNA" data-i18n="bio_btn_dna">🧬 DNA Sarmalı</button>
        <button class="btn" onclick="setMode('PROTEIN')" id="btn-PROTEIN" data-i18n="bio_btn_protein">🧶 Protein Yapıları</button>
        <button class="btn" onclick="setMode('REPLICATION')" id="btn-REPLICATION" data-i18n="bio_btn_replication">✂️ DNA Replikasyonu</button>
        <button class="btn" onclick="setMode('SYNTHESIS')" id="btn-SYNTHESIS" data-i18n="bio_btn_synthesis">🏭 Protein Sentezi</button>
        <button class="btn" onclick="setMode('CELL')" id="btn-CELL" data-i18n="bio_btn_cell">🧫 Canlı Hücre Modu</button>
    </div>

    <div id="science-panel" class="glass-panel">
        <div id="science-content-wrapper">
            <div class="science-inner">
                <h3 id="panel-title">DNA Analizi</h3>
                <div id="panel-content">Yükleniyor...</div>
            </div>
        </div>
        <div class="science-handle-zone" onclick="toggleSciencePanel()">
            <div class="science-handle"></div>
            <span class="science-toggle-text" id="science-toggle-text" data-i18n="bio_hide_panel">🔼 PANELİ GİZLE</span>
        </div>
    </div>

    <div id="action-panel" class="glass-panel" style="display: none;"></div>

    <div id="edu-panel" class="glass-panel">
        <div class="edu-handle-zone" onclick="toggleEduPanel()">
            <div class="edu-handle"></div>
            <span class="edu-toggle-text" id="edu-toggle-text" data-i18n="bio_open_guide">📖 Konu Anlatımını Aç</span>
        </div>
        <h3 id="edu-title" style="margin-top: 5px;">DNA Nedir?</h3>
        <div class="edu-content-area" id="edu-content"></div>
    </div>

    <div id="info-card" class="glass-panel">
        <h3 id="info-title" style="border-bottom:none; margin-bottom:5px;">Başlık</h3>
        <p id="info-desc" style="font-size:13px; margin-bottom:15px; color:#ddd; line-height:1.5;">Açıklama</p>
        <div id="info-actions"></div>
        <button class="btn" onclick="document.getElementById('info-card').style.display='none'" style="width:100%; text-align:center; margin-top:10px; background:rgba(255,255,255,0.1)" id="info-btn-close" data-i18n="bio_btn_close">Kapat</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
    <script src="lang.js"></script>

    <script>
        // Modal Yönetimi
        function openNavModal() {
            document.getElementById('modal-title').innerText = t('modal_exit_title');
            document.getElementById('modal-desc').innerText = t('modal_exit_desc');
            document.getElementById('modal-cancel').innerText = t('modal_cancel');
            document.getElementById('modal-confirm').innerText = t('modal_confirm');
            document.getElementById('nav-modal').style.display = 'flex';
        }
        function closeNavModal() {
            document.getElementById('nav-modal').style.display = 'none';
        }
        function confirmGoHome() {
            window.location.href = 'index.html';
        }

        const uiData = {
            'DNA': {
                title: () => t('bio_ui_dna_title'),
                html: () => `<div class="data-row"><span class="data-label">${t('bio_ui_dna_dia')}</span><span class="data-value">2.0 nm</span></div><div class="data-row"><span class="data-label">${t('bio_ui_dna_bp_turn')}</span><span class="data-value">10.5</span></div><div class="data-row"><span class="data-label">${t('bio_ui_dna_turn_len')}</span><span class="data-value">3.4 nm</span></div><div class="data-row"><span class="data-label">${t('bio_ui_dna_total_bp')}</span><span class="data-value">40</span></div><div class="data-row"><span class="data-label">${t('bio_ui_dna_total_len')}</span><span class="data-value">136 Å</span></div>`
            },
            'PROTEIN': {
                title: () => t('bio_ui_protein_title'),
                html: () => `<div class="data-row"><span class="data-label">${t('bio_ui_prot_aa')}</span><span class="data-value">100</span></div><div class="data-row"><span class="data-label">${t('bio_ui_prot_mol_wt')}</span><span class="data-value">~11 kDa</span></div><div class="data-row"><span class="data-label">${t('bio_ui_prot_energy')}</span><span class="data-value highlight" id="prot-energy">-24.1 kcal/mol</span></div><div class="data-row"><span class="data-label">${t('bio_ui_prot_hydrophobic')}</span><span class="data-value">${t('bio_ui_prot_hydrophobic_val')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_prot_hydrophilic')}</span><span class="data-value">${t('bio_ui_prot_hydrophilic_val')}</span></div>`
            },
            'CELL': {
                title: () => t('bio_ui_cell_title'),
                html: () => `<div class="data-row"><span class="data-label">${t('bio_ui_cell_membrane')}</span><span class="data-value">${t('bio_ui_cell_membrane_val')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_cell_nucleus')}</span><span class="data-value">${t('bio_ui_cell_nucleus_val')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_cell_mito')}</span><span class="data-value">${t('bio_ui_cell_mito_val')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_cell_lyso')}</span><span class="data-value">${t('bio_ui_cell_lyso_val')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_cell_centro')}</span><span class="data-value">${t('bio_ui_cell_centro_val')}</span></div>`
            },
            'REPLICATION': {
                title: () => t('bio_ui_rep_title'),
                html: () => `<div class="data-row"><span class="data-label" style="color:#00faff">${t('bio_ui_rep_leading')}</span><span class="data-value">${t('bio_ui_rep_leading_val')}</span></div><div class="data-row"><span class="data-label" style="color:#ff0055">${t('bio_ui_rep_lagging')}</span><span class="data-value">${t('bio_ui_rep_lagging_val')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_rep_helicase')}</span><span class="data-value" id="rep-hel">${t('bio_ui_waiting')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_rep_primase')}</span><span class="data-value" id="rep-pri">${t('bio_ui_waiting')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_rep_polymerase')}</span><span class="data-value" id="rep-pol">${t('bio_ui_waiting')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_rep_ligase')}</span><span class="data-value" id="rep-lig">${t('bio_ui_waiting')}</span></div>`
            },
            'SYNTHESIS': {
                title: () => t('bio_ui_synth_title'),
                html: () => `<div class="data-row"><span class="data-label">${t('bio_ui_synth_dna_mrna')}</span><span class="data-value">${t('bio_ui_synth_transcription')}</span></div><div class="data-row"><span class="data-label">${t('bio_ui_synth_mrna_prot')}</span><span class="data-value">${t('bio_ui_synth_translation')}</span></div><div class="data-row"><span class="data-label" style="color:#00faff">${t('bio_ui_synth_active_codon')}</span><span class="data-value highlight" id="syn-codon">---</span></div><div class="data-row"><span class="data-label" style="color:#00faff">${t('bio_ui_synth_amino_acid')}</span><span class="data-value highlight" id="syn-aa">---</span></div>`
            }
        };

        const eduData = {
            'DNA': {
                title: () => t('bio_edu_dna_title'),
                content: () => t('bio_edu_dna_content')
            },
            'PROTEIN': {
                title: () => t('bio_edu_prot_title'),
                content: () => t('bio_edu_prot_content')
            },
            'REPLICATION': {
                title: () => t('bio_edu_rep_title'),
                content: () => t('bio_edu_rep_content')
            },
            'SYNTHESIS': {
                title: () => t('bio_edu_synth_title'),
                content: () => t('bio_edu_synth_content')
            },
            'CELL': {
                title: () => t('bio_edu_cell_title'),
                content: () => t('bio_edu_cell_content')
            }
        };

        const dict = {
            'A': { name: () => t('bio_base_A_name'), desc: () => t('bio_base_A_desc'), color: 0xff3333, mat: null },
            'T': { name: () => t('bio_base_T_name'), desc: () => t('bio_base_T_desc'), color: 0x3333ff, mat: null },
            'G': { name: () => t('bio_base_G_name'), desc: () => t('bio_base_G_desc'), color: 0x33ff33, mat: null },
            'C': { name: () => t('bio_base_C_name'), desc: () => t('bio_base_C_desc'), color: 0xffff33, mat: null }
        };

        const codonDict = [
            { c: "AUG", a: () => t('bio_aa_met') },
            { c: "GUC", a: () => t('bio_aa_val') },
            { c: "UUC", a: () => t('bio_aa_phe') },
            { c: "CCA", a: () => t('bio_aa_pro') },
            { c: "UGG", a: () => t('bio_aa_trp') },
            { c: "UAA", a: () => t('bio_aa_stop') }
        ];

        let scene, camera, renderer, sceneGroup;
        let dnaGroup, repGroup, protGroup, synthGroup, cellGroup, bgParticles;
        let currentMode = 'DNA';
        let raycastObjects = [];
        let aaMeshes = [];
        let enzymeMesh = null;
        let isActionRunning = false;
        let actionRunId = 0;
        let activeActionTweens = [];
        let actionTimeouts = [];

        function cancelActionAnimations() {
            actionRunId++;
            activeActionTweens.forEach(tween => tween.stop());
            activeActionTweens = [];
            actionTimeouts.forEach(timeoutId => clearTimeout(timeoutId));
            actionTimeouts = [];
            isActionRunning = false;
        }

        // Delta Time Zamanlayıcısı (Frame Rate Bağımsızlığı İçin)
        let clock;
        let dtFactor = 1;

        // Akıcı ve Hızlı Kamera Zoom Değişkenleri
        let targetCameraZ = 60;

        // Organel Takip ve Vurgulama Değişkenleri
        let organelleRefs = {};
        let trackedOrganelle = null;
        let trackedMarkerScale = 1;
        let selectionMarker = null;

        function initApp() {
            try {
                if (typeof THREE === 'undefined') throw new Error("3D kütüphanesi yüklenemedi.");
                init3D();
                setMode('DNA');
            } catch (error) {
                document.getElementById('panel-content').innerHTML = `<span style="color:#ff0055; font-weight:bold;">Sistem Durduruldu:</span> <br/><br/> ${error.message}`;
            }
        }

        function init3D() {
            scene = new THREE.Scene();
            clock = new THREE.Clock();

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.z = targetCameraZ;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x020205, 1);
            document.body.appendChild(renderer.domElement);

        function createAdvancedDNA(group, isReplication) {
            const numPairs = 40;
            const radius = 4.5;
            const rise = 1.2;

            const matPhosphate = new THREE.MeshLambertMaterial({ color: 0x555555, emissive: 0x111111 });
            const matSugar = new THREE.MeshLambertMaterial({ color: 0x888888 });
            const matBond = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.3 });

            const baseGeo = new THREE.CylinderGeometry(0.6, 0.6, 2.2, 32);
            baseGeo.rotateX(Math.PI / 2);
            baseGeo.scale(1, 0.4, 1);

            const phosGeo = new THREE.SphereGeometry(0.8, 16, 16);
            const sugarGeo = new THREE.CylinderGeometry(0.6, 0.6, 0.6, 5);
            const bondGeo = new THREE.CylinderGeometry(0.04, 0.04, 1.8, 16);

            let angle = 0;
            for (let i = 0; i < numPairs; i++) {
                const y = (i - numPairs / 2) * rise;
                const a1 = angle;
                const a2 = angle + 2.4;

                const p1 = new THREE.Vector3(Math.cos(a1) * radius, y, Math.sin(a1) * radius);
                const p2 = new THREE.Vector3(Math.cos(a2) * radius, y, Math.sin(a2) * radius);

                const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);
                const d = p1.distanceTo(mid);

                const isAT = Math.random() > 0.5;
                const isFlipped = Math.random() > 0.5;

                let t1 = isAT ? (isFlipped ? 'A' : 'T') : (isFlipped ? 'G' : 'C');
                let t2 = isAT ? (isFlipped ? 'T' : 'A') : (isFlipped ? 'C' : 'G');

                let m1 = dict[t1].mat;
                let m2 = dict[t2].mat;

                const leftPair = new THREE.Group();
                leftPair.position.copy(mid);
                leftPair.lookAt(p1);

                const rightPair = new THREE.Group();
                rightPair.position.copy(mid);
                rightPair.lookAt(p1);

                const phos1 = new THREE.Mesh(phosGeo, matPhosphate); phos1.position.set(0, 0, d);
                const sug1 = new THREE.Mesh(sugarGeo, matSugar); sug1.position.set(0, 0, d - 0.8);
                const b1 = new THREE.Mesh(baseGeo, m1); b1.position.set(0, 0, d - 2.2); b1.userData = { type: t1, pair: t2 };
                leftPair.add(phos1, sug1, b1);

                const phos2 = new THREE.Mesh(phosGeo, matPhosphate); phos2.position.set(0, 0, -d);
                const sug2 = new THREE.Mesh(sugarGeo, matSugar); sug2.position.set(0, 0, -d + 0.8);
                const b2 = new THREE.Mesh(baseGeo, m2); b2.position.set(0, 0, -d + 2.2); b2.userData = { type: t2, pair: t1 };
                rightPair.add(phos2, sug2, b2);

                const bonds = new THREE.Group();
                const bondCount = isAT ? 2 : 3;
                for (let b = 0; b < bondCount; b++) {
                    const bond = new THREE.Mesh(bondGeo, matBond);
                    bond.rotation.x = Math.PI / 2;
                    bond.position.x = (b - (bondCount - 1) / 2) * 0.5;
                    bonds.add(bond);
                }

                if (!isReplication) {
                    leftPair.add(bonds);
                } else {
                    leftPair.add(bonds);

                    const newB2 = new THREE.Mesh(baseGeo, m2); newB2.position.set(0, 0, -d + 2.2); newB2.scale.set(0.001, 0.001, 0.001);
                    const newSug2 = new THREE.Mesh(sugarGeo, matSugar); newSug2.position.set(0, 0, -d + 0.8); newSug2.scale.set(0.001, 0.001, 0.001);
                    const newPhos2 = new THREE.Mesh(phosGeo, matPhosphate); newPhos2.position.set(0, 0, -d); newPhos2.scale.set(0.001, 0.001, 0.001);
                    const newBonds1 = bonds.clone(); newBonds1.scale.set(0.001, 0.001, 0.001);
                    leftPair.add(newB2, newSug2, newPhos2, newBonds1);

                    const newB1 = new THREE.Mesh(baseGeo, m1); newB1.position.set(0, 0, d - 2.2); newB1.scale.set(0.001, 0.001, 0.001);
                    const newSug1 = new THREE.Mesh(sugarGeo, matSugar); newSug1.position.set(0, 0, d - 0.8); newSug1.scale.set(0.001, 0.001, 0.001);
                    const newPhos1 = new THREE.Mesh(phosGeo, matPhosphate); newPhos1.position.set(0, 0, d); newPhos1.scale.set(0.001, 0.001, 0.001);
                    const newBonds2 = bonds.clone(); newBonds2.scale.set(0.001, 0.001, 0.001);
                    rightPair.add(newB1, newSug1, newPhos1, newBonds2);

                    leftPair.userData = {
                        isLeft: true, bonds: bonds,
                        newB: newB2, newSug: newSug2, newPhos: newPhos2, newBonds: newBonds1,
                        replicated: false, shifted: 0
                    };

                    rightPair.userData = {
                        isRight: true,
                        newB: newB1, newSug: newSug1, newPhos: newPhos1, newBonds: newBonds2,
                        replicated: false, shifted: 0
                    };
                }

                group.add(leftPair, rightPair);
                if (!isReplication) raycastObjects.push(b1, b2);

                angle += 0.598;
            }
        }

        function createAdvancedProtein() {
            const numAA = 100;
            const geo = new THREE.SphereGeometry(0.7, 12, 12);
            const matHelix = new THREE.MeshLambertMaterial({ color: 0xff3333 });
            const matSheet = new THREE.MeshLambertMaterial({ color: 0x3333ff });
            const matLoop = new THREE.MeshLambertMaterial({ color: 0xaaaaaa });

            for (let i = 0; i < numAA; i++) {
                let mat = matLoop;
                if (i > 15 && i < 35) mat = matHelix;
                if (i > 50 && i < 70) mat = matSheet;
                if (i > 80 && i < 95) mat = matHelix;

                const mesh = new THREE.Mesh(geo, mat);
                protGroup.add(mesh);
                aaMeshes.push(mesh);

                const p1 = new THREE.Vector3((i - numAA / 2) * 1.2, 0, 0);
                const p2 = new THREE.Vector3();
                if (mat === matHelix) p2.set(Math.cos(i) * 3, (i - 50) * 0.8, Math.sin(i) * 3);
                else if (mat === matSheet) p2.set((i - 60) * 1.5, Math.sin(i * Math.PI / 2) * 2, 0);
                else p2.set((i - numAA / 2) * 1.2, Math.sin(i) * 1.5, 0);

                const phi = Math.acos(-1 + (2 * i) / numAA);
                const theta = Math.sqrt(numAA * Math.PI) * phi;
                const r = 8 + Math.sin(i * 0.5) * 2;
                const p3 = new THREE.Vector3(r * Math.cos(theta) * Math.sin(phi), r * Math.sin(theta) * Math.sin(phi), r * Math.cos(phi));

                const subunitOffset = (i < 50) ? new THREE.Vector3(-6, 0, 0) : new THREE.Vector3(6, 0, 0);
                const p4 = p3.clone().multiplyScalar(0.7).add(subunitOffset);

                mesh.userData = { p1, p2, p3, p4 };
                mesh.position.copy(p1);
            }
        }

        window.focusOrganelle = function (type) {
            if (typeof TWEEN === 'undefined') return;

            if (type === 'RESET') {
                trackedOrganelle = null;
                if (selectionMarker) selectionMarker.visible = false;

                targetCameraZ = 75;
                new TWEEN.Tween(sceneGroup.position).to({ x: 0, y: 0, z: 0 }, 1000).easing(TWEEN.Easing.Cubic.Out).start();
                document.getElementById('info-card').style.display = 'none';
                return;
            }

            const data = organelleRefs[type];
            if (!data || !data.obj) return;

            trackedOrganelle = data.obj;
            trackedMarkerScale = data.markerScale || 5;

            if (selectionMarker) {
                if (selectionMarker.parent) selectionMarker.parent.remove(selectionMarker);
                data.obj.add(selectionMarker);
                selectionMarker.position.set(0, 0, 0);
                selectionMarker.visible = true;
            }

            targetCameraZ = data.camZ || 25;

            document.getElementById('info-title').innerText = data.name();
            document.getElementById('info-title').style.color = "#00faff";
            document.getElementById('info-desc').innerText = data.desc();
            document.getElementById('info-actions').innerHTML = "";
            document.getElementById('info-card').style.display = 'block';
        };

                                <button class="btn" onclick="focusOrganelle('LYSO')">🟡 ${t('bio_btn_org_lyso')}</button>
                                <button class="btn" onclick="focusOrganelle('CENTRO')">🟧 ${t('bio_btn_org_centro')}</button>
                                <button class="btn" onclick="focusOrganelle('RESET')" style="background:rgba(0,250,255,0.2); border-color:#00faff; font-weight:bold;">🔍 ${t('bio_btn_org_reset')}</button>`;
            } else {
                act.style.display = 'none';
            }
        };

        window.toggleSciencePanel = function () {
            const wrapper = document.getElementById('science-content-wrapper');
            const toggleText = document.getElementById('science-toggle-text');
            wrapper.classList.toggle('closed');
            toggleText.innerText = wrapper.classList.contains('closed') ? t('bio_show_panel') : t('bio_hide_panel');
        }

        window.toggleEduPanel = function () {
            const panel = document.getElementById('edu-panel');
            const toggleText = document.getElementById('edu-toggle-text');
            panel.classList.toggle('open');
            toggleText.innerText = panel.classList.contains('open') ? t('bio_close_guide') : t('bio_open_guide');
        }

        window.resetReplicationUI = function () {
            isActionRunning = false;
            repGroup.clear();
            createAdvancedDNA(repGroup, true);
            document.getElementById('rep-hel').innerText = t('bio_ui_waiting');
            document.getElementById('rep-pri').innerText = t('bio_ui_waiting');
            document.getElementById('rep-pol').innerText = t('bio_ui_waiting');
            document.getElementById('rep-lig').innerText = t('bio_ui_waiting');

            const act = document.getElementById('action-panel');
            act.innerHTML = `<button id="main-action-btn" class="btn" onclick="startReplication()" style="background:rgba(0,250,100,0.2); border-color:#00fa64; width:100%; text-align:center;">${t('bio_btn_start_rep')}</button>`;
        }

        window.resetSynthesisUI = function () {
            isActionRunning = false;
            synthGroup.clear();
            document.getElementById('syn-codon').innerText = "---";
            document.getElementById('syn-aa').innerText = "---";

            const act = document.getElementById('action-panel');
            act.innerHTML = `<button id="main-action-btn" class="btn" onclick="startSynthesis()" style="background:rgba(200,100,255,0.2); border-color:#c864ff; width:100%; text-align:center;">${t('bio_btn_start_synth')}</button>`;
        }

        window.animP = function (k) {
            if (typeof TWEEN === 'undefined') return;
            aaMeshes.forEach((m, idx) => {
                new TWEEN.Tween(m.position).to(m.userData[k], 1200).easing(TWEEN.Easing.Cubic.InOut).delay(idx * 10).start();
            });

            let targetEnergy = 0;
            if (k === 'p1') targetEnergy = -12.4;
            else if (k === 'p2') targetEnergy = -18.7;
            else if (k === 'p3') targetEnergy = -24.1;
            else if (k === 'p4') targetEnergy = -28.5;

            let el = document.getElementById('prot-energy');
            if (el) {
                let currentVal = parseFloat(el.innerText) || -12.4;
                let energyObj = { val: currentVal };
                new TWEEN.Tween(energyObj).to({ val: targetEnergy }, 1200).onUpdate(() => {
                    el.innerText = energyObj.val.toFixed(1) + " kcal/mol";
                }).start();
            }
        };

        window.startReplication = function () {
            if (typeof TWEEN === 'undefined' || isActionRunning) return;
            isActionRunning = true;

            const mainBtn = document.getElementById('main-action-btn');
            if (mainBtn) {
                mainBtn.innerText = t('bio_btn_rep_running');
                mainBtn.style.opacity = "0.5";
                mainBtn.style.pointerEvents = "none";
            }

            const h = document.getElementById('rep-hel'); const p = document.getElementById('rep-pri');
            const pol = document.getElementById('rep-pol'); const l = document.getElementById('rep-lig');

            const helicaseGroup = new THREE.Group();
            const matHel = new THREE.MeshLambertMaterial({ color: 0xffaa00, emissive: 0x442200 });
            for (let i = 0; i < 6; i++) {
                const sub = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), matHel);
                sub.position.x = Math.cos(i * Math.PI / 3) * 2;
                sub.position.z = Math.sin(i * Math.PI / 3) * 2;
                helicaseGroup.add(sub);
            }
            helicaseGroup.rotation.x = Math.PI / 2; helicaseGroup.position.y = -26;
            repGroup.add(helicaseGroup);

            const polGroup = new THREE.Group();
            const matPol = new THREE.MeshLambertMaterial({ color: 0x00ffaa, emissive: 0x004422 });
            const palm = new THREE.Mesh(new THREE.SphereGeometry(2.5, 16, 16), matPol);
            const thumb = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 3, 16), matPol);
            thumb.position.set(2.5, 1.5, 0); thumb.rotation.z = -Math.PI / 4;
            const fingers = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 4, 16), matPol);
            fingers.position.set(-2.5, 1.5, 0); fingers.rotation.z = Math.PI / 4;
            polGroup.add(palm, thumb, fingers);
            polGroup.position.set(0, -32, 0);
            repGroup.add(polGroup);

            h.innerText = t('bio_ui_active_opening'); h.classList.add('highlight');

            new TWEEN.Tween(helicaseGroup.position).to({ y: 25 }, 8000).onUpdate(() => {
                helicaseGroup.rotation.z += 0.1 * dtFactor;
                repGroup.children.forEach(c => {
                    if (c.userData && (c.userData.isLeft || c.userData.isRight) && c.position.y < helicaseGroup.position.y + 2) {
                        if (c.userData.bonds) c.userData.bonds.visible = false;
                        if (c.userData.shifted < 8.0) {
                            c.userData.shifted += 0.25 * dtFactor;
                            c.position.x += (c.userData.isLeft ? -0.25 : 0.25) * dtFactor;
                        }
                    }
                });
            }).onComplete(() => {
                h.innerText = t('bio_ui_completed'); h.classList.remove('highlight');
                repGroup.remove(helicaseGroup);
            }).start();

            setTimeout(() => {
                p.innerText = t('bio_ui_active'); p.classList.add('highlight');
                pol.innerText = t('bio_ui_active_synth'); pol.classList.add('highlight');
                new TWEEN.Tween(polGroup.position).to({ y: 25 }, 7000).onUpdate(() => {
                    polGroup.rotation.y += 0.05 * dtFactor;
                    repGroup.children.forEach(c => {
                        if (c.userData && !c.userData.replicated) {
                            if (c.userData.isLeft && c.position.y < polGroup.position.y) {
                                c.userData.replicated = true;
                                new TWEEN.Tween(c.userData.newB.scale).to({ x: 1, y: 1, z: 1 }, 300).start();
                                new TWEEN.Tween(c.userData.newSug.scale).to({ x: 1, y: 1, z: 1 }, 300).start();
                                new TWEEN.Tween(c.userData.newPhos.scale).to({ x: 1, y: 1, z: 1 }, 300).start();
                                new TWEEN.Tween(c.userData.newBonds.scale).to({ x: 1, y: 1, z: 1 }, 300).start();
                            } else if (c.userData.isRight) {
                                let blockSize = 6.0;
                                let blockIndex = Math.floor(c.position.y / blockSize);
                                let blockYThreshold = (blockIndex + 1) * blockSize;

                                if (polGroup.position.y > blockYThreshold + 2.0) {
                                    c.userData.replicated = true;
                                    let delay = Math.max(0, (blockYThreshold - c.position.y) * 150);
                                    new TWEEN.Tween(c.userData.newB.scale).to({ x: 1, y: 1, z: 1 }, 300).delay(delay).start();
                                    new TWEEN.Tween(c.userData.newSug.scale).to({ x: 1, y: 1, z: 1 }, 300).delay(delay).start();
                                    new TWEEN.Tween(c.userData.newPhos.scale).to({ x: 1, y: 1, z: 1 }, 300).delay(delay).start();
                                    new TWEEN.Tween(c.userData.newBonds.scale).to({ x: 1, y: 1, z: 1 }, 300).delay(delay).start();
                                }
                            }
                        }
                    });
                }).onComplete(() => {
                    pol.innerText = t('bio_ui_finished'); pol.classList.remove('highlight');
                    p.innerText = t('bio_ui_finished'); p.classList.remove('highlight');
                    l.innerText = t('bio_ui_active_binding'); l.classList.add('highlight');
                    repGroup.remove(polGroup);
                    setTimeout(() => {
                        l.innerText = t('bio_ui_completed'); l.classList.remove('highlight');
                        showToast(t('bio_toast_rep_success'));

                        if (mainBtn) {
                            mainBtn.innerText = t('bio_btn_restart');
                            mainBtn.style.opacity = "1";
                            mainBtn.style.pointerEvents = "auto";
                            mainBtn.setAttribute("onclick", "resetReplicationUI()");
                        }
                    }, 1500);
                }).start();
            }, 1500);
        };

        window.startSynthesis = function () {
            if (typeof TWEEN === 'undefined' || isActionRunning) return;
            isActionRunning = true;
            const runId = actionRunId;

            const mainBtn = document.getElementById('main-action-btn');
            if (mainBtn) {
                mainBtn.innerText = t('bio_btn_synth_running');
                mainBtn.style.opacity = "0.5";
                mainBtn.style.pointerEvents = "none";
            }

            const mrna = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 50, 16), new THREE.MeshLambertMaterial({ color: 0xff00ff }));
            mrna.rotation.z = Math.PI / 2;
            synthGroup.add(mrna);

            const riboGroup = new THREE.Group();
            const riboTop = new THREE.Mesh(new THREE.TorusGeometry(3.5, 1.5, 16, 32), new THREE.MeshLambertMaterial({ color: 0xaaaaaa }));
            const riboBot = new THREE.Mesh(new THREE.SphereGeometry(2.5, 16, 16), new THREE.MeshLambertMaterial({ color: 0x888888 }));
            riboBot.position.y = -3;
            riboGroup.add(riboTop, riboBot);
            riboGroup.position.set(-25, 0, 0);
            synthGroup.add(riboGroup);

            let aaChain = [];

            const synthesisTween = new TWEEN.Tween(riboGroup.position).to({ x: 25 }, 10000).onUpdate((obj) => {
                if (runId !== actionRunId || currentMode !== 'SYNTHESIS') return;
                let progress = (obj.x + 25) / 50;
                let cIdx = Math.floor(progress * codonDict.length);
                if (codonDict[cIdx]) {
                    document.getElementById('syn-codon').innerText = codonDict[cIdx].c;
                    document.getElementById('syn-aa').innerText = codonDict[cIdx].a();
                }

                if (progress > 0.1 && Math.random() > 0.95) {
                    const aa = new THREE.Mesh(new THREE.SphereGeometry(0.8, 8, 8), new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff }));
                    aa.position.copy(riboGroup.position); aa.position.y += 4;
                    synthGroup.add(aa);
                    aaChain.push(aa);
                }

                aaChain.forEach((a, i) => { a.position.y += 0.05 * dtFactor; a.position.x = obj.x + Math.sin(i) * 1; });

            }).onComplete(() => {
                if (runId !== actionRunId || currentMode !== 'SYNTHESIS') return;
                showToast(t('bio_toast_synth_success'));

                if (mainBtn) {
                    mainBtn.innerText = t('bio_btn_restart');
                    mainBtn.style.opacity = "1";
                    mainBtn.style.pointerEvents = "auto";
                    mainBtn.setAttribute("onclick", "resetSynthesisUI()");
                }
            }).start();
            activeActionTweens.push(synthesisTween);
        };

        function setupTouchControls() {
            let isDown = false; let lastX = 0, lastY = 0;
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            const activeTouches = new Map();
            let initialPinchDistance = 0;

            window.addEventListener('wheel', (e) => {
                if (e.target.closest('.glass-panel') || e.target.closest('.modal-card')) return;

                const zoomFactor = e.deltaY > 0 ? 1.15 : 0.85;
                targetCameraZ = Math.max(5, Math.min(350, targetCameraZ * zoomFactor));
            }, { passive: true });

            window.addEventListener('pointerdown', (e) => {
                if (e.target.closest('.glass-panel') || e.target.closest('.modal-card') || e.target.closest('#back-btn')) return;

                activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });

                if (activeTouches.size === 2) {
                    const touches = Array.from(activeTouches.values());
                    initialPinchDistance = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
                } else if (activeTouches.size === 1) {
                    isDown = true; lastX = e.clientX; lastY = e.clientY;
                }

                if (activeTouches.size === 1 && currentMode === 'DNA') {
                    mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);

                    const activeRaycasts = raycastObjects.filter(obj => dnaGroup.visible && obj.userData.type);
                    const intersects = raycaster.intersectObjects(activeRaycasts);

                    if (intersects.length > 0) {
                        const obj = intersects[0].object;
                        let t = obj.userData.type;
                        document.getElementById('info-title').innerText = dict[t].name();
                        document.getElementById('info-title').style.color = "#" + dict[t].color.toString(16);
                        document.getElementById('info-desc').innerText = dict[t].desc();
                        document.getElementById('info-actions').innerHTML = `<button class="btn" onclick="createMutation('${obj.uuid}')" style="width:100%; background:rgba(255,0,0,0.3); border-color:red; text-align:center;">${t('bio_btn_create_mutation')}</button>`;
                        window.selectedBaseMesh = obj;
                        document.getElementById('info-card').style.display = 'block';
                    }
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (activeTouches.has(e.pointerId)) {
                    activeTouches.set(e.pointerId, { x: e.clientX, y: e.clientY });
                }

                if (activeTouches.size === 2) {
                    const touches = Array.from(activeTouches.values());
                    const currentPinchDistance = Math.hypot(touches[0].x - touches[1].x, touches[0].y - touches[1].y);
                    const distanceDelta = initialPinchDistance - currentPinchDistance;

                    const pinchSensitivity = 0.006;
                    targetCameraZ *= Math.exp(distanceDelta * pinchSensitivity);
                    targetCameraZ = Math.max(5, Math.min(350, targetCameraZ));

                    initialPinchDistance = currentPinchDistance;
                } else if (isDown && activeTouches.size === 1) {
                    const dx = e.clientX - lastX; const dy = e.clientY - lastY;
                    sceneGroup.rotation.y += dx * 0.005; sceneGroup.rotation.x += dy * 0.005;
                    lastX = e.clientX; lastY = e.clientY;
                }
            });

            const removePointer = (e) => {
                activeTouches.delete(e.pointerId);
                if (activeTouches.size < 1) isDown = false;
            };

            window.addEventListener('pointerup', removePointer);
            window.addEventListener('pointercancel', removePointer);
        }

        window.createMutation = function () {
            if (!window.selectedBaseMesh || typeof TWEEN === 'undefined') return;
            document.getElementById('info-card').style.display = 'none';

            const target = window.selectedBaseMesh;
            const originalType = target.userData.type;

            target.material = new THREE.MeshLambertMaterial({ color: 0x555555, emissive: 0xff0000 });
            showToast(`⚠️ ${t('bio_ui_waiting')} ${dict[originalType].name()}`);

            if (!enzymeMesh) {
                enzymeMesh = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshLambertMaterial({ color: 0x00ffff, emissive: 0x00aaff }));
                dnaGroup.add(enzymeMesh);
            }
            enzymeMesh.position.set(20, 20, 20);

            const targetPos = new THREE.Vector3();
            target.getWorldPosition(targetPos);
            dnaGroup.worldToLocal(targetPos);

            new TWEEN.Tween(enzymeMesh.position).to(targetPos, 2000).easing(TWEEN.Easing.Quadratic.InOut).onComplete(() => {
                target.material = dict[originalType].mat;
                showToast(t('bio_toast_repair'));
                new TWEEN.Tween(enzymeMesh.position).to({ x: -20, y: -20, z: -20 }, 2000).start();
            }).start();
        };

        function showToast(msg) {
            const t_elem = document.getElementById('toast');
            t_elem.innerText = msg; t_elem.style.display = 'block';
            setTimeout(() => { t_elem.style.display = 'none'; }, 3500);
        }

        function animate() {
            try {
                requestAnimationFrame(animate);

                // Delta time hesabı (Cihaz yenileme hızından bağımsız sabit simülasyon hızı)
                const delta = Math.min(clock.getDelta(), 0.1);
                dtFactor = delta * 60; // 60 FPS referanslı ölçekleme faktörü

                if (typeof TWEEN !== 'undefined') TWEEN.update();

                // Yumuşak kamera yaklaşması (Frame-rate independent lerp)
                const lerpZ = 1 - Math.pow(1 - 0.12, dtFactor);
                camera.position.z += (targetCameraZ - camera.position.z) * lerpZ;

                bgParticles.children.forEach(p => {
                    p.position.add(p.userData.dir.clone().multiplyScalar(p.userData.speed * dtFactor));
                    if (p.position.length() > 60) p.position.multiplyScalar(-0.9);
                });

                if (repGroup.visible) repGroup.rotation.y += 0.003 * dtFactor;
                if (dnaGroup.visible) dnaGroup.rotation.y += 0.003 * dtFactor;
                if (protGroup.visible) protGroup.rotation.y += 0.004 * dtFactor;

                if (cellGroup.visible) {
                    cellGroup.rotation.y += 0.0015 * dtFactor;

                    if (window.cytoParticles) {
                        window.cytoParticles.rotation.y -= 0.001 * dtFactor;
                        window.cytoParticles.rotation.x += 0.0005 * dtFactor;
                    }

                    const time = Date.now();

                    if (window.cellMembrane) {
                        const t = time * 0.001;
                        window.cellMembrane.scale.x = 1.0 + Math.sin(t * 1.5) * 0.015;
                        window.cellMembrane.scale.y = 1.0 + Math.cos(t * 1.2) * 0.015;
                        window.cellMembrane.scale.z = 1.0 + Math.sin(t * 1.7) * 0.015;
                    }

                    cellGroup.children.forEach(child => {
                        if (child.userData && child.userData.floatSpeed) {
                            child.position.y += Math.sin(time * child.userData.floatSpeed + child.userData.floatOffset) * 0.006 * dtFactor;
                        }
                    });

                    if (trackedOrganelle) {
                        const worldPos = new THREE.Vector3();
                        trackedOrganelle.getWorldPosition(worldPos);

                        const offset = worldPos.clone().sub(sceneGroup.position);
                        const targetScenePos = offset.negate();

                        const lerpScene = 1 - Math.pow(1 - 0.08, dtFactor);
                        sceneGroup.position.lerp(targetScenePos, lerpScene);

                        if (selectionMarker && selectionMarker.visible) {
                            selectionMarker.children[0].rotation.z += 0.03 * dtFactor;
                            selectionMarker.children[1].rotation.x += 0.03 * dtFactor;
                            const pulse = 1 + Math.sin(time * 0.006) * 0.12;
                            selectionMarker.scale.setScalar(trackedMarkerScale * pulse);
                        }
                    }
                }

                renderer.render(scene, camera);
            } catch (error) {
                document.getElementById('panel-content').innerHTML = `<span style="color:#ff0055; font-weight:bold;">Sistem Durduruldu:</span> <br/><br/> ${error.message}`;
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        document.addEventListener('DOMContentLoaded', () => {
            initApp();
        });
    </script>
</body>
